<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light}body{margin:0;padding:1rem;overflow:auto;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#17201c;background:#faf8f3}*{box-sizing:border-box}
html,body{height:100%}body{background:#0b1526;color:#e8edf5;font-family:"Noto Serif TC",serif;
     display:flex;align-items:center;justify-content:center;overflow:hidden}.field{position:absolute;inset:-40px;pointer-events:none}@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:1}}.star{position:absolute;left:8%;top:6%;width:2px;height:2px;background:#fdf6d8;
      border-radius:50%;animation:twinkle 3s ease-in-out infinite}.window{text-align:center;z-index:5;padding:2rem}.kicker{letter-spacing:.45em;font-size:.72rem;color:#9fb4cc;animation:fadeUp 1.6s ease .2s both}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1}}h1{margin-top:1.3rem;font-size:3.1rem;letter-spacing:.16em;
   background:linear-gradient(90deg,#fdf6d8 20%,#ffce7a);
   -webkit-background-clip:text;background-clip:text;color:transparent;
   animation:fadeUp 1.4s ease .5s both}.sub{margin-top:.9rem;font-size:.95rem;color:#b8c7da;letter-spacing:.25em;
     animation:fadeUp 1.2s ease 1.3s both}@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}.lamp{margin-top:1.8rem;font-size:1.9rem;display:inline-block;
      animation:fadeUp .7s ease 2s both, swing 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head><body><div class="field"><i class="star"></i></div>
<div class="window">
 <div class="kicker">一座只收思念的燈塔</div>
 <h1>風的信使</h1>
 <div class="sub">海員把寄不出的話，交給住在燈塔的人。</div>

</div>
</body></html>
