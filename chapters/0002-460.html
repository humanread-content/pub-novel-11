*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}body{background:#06101f;color:#dfe8f3;font-family:"Noto Serif TC",serif;
     min-height:100vh;display:flex;overflow:hidden}.content{position:relative;z-index:5;max-width:32em;margin:10vh 8% auto;}.content p{line-height:2.15;color:#c6d4e4;font-size:.98rem;letter-spacing:.06em;

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}</style></head><body><div class="content">
  <p>燈塔建在島的盡頭，面朝那片永遠不會安靜下來的海。</p>
  <p>入夜之後，浪會一層層湧上岸。而住在燈塔的人說，那不是單純的浪聲——</p>
  <p>那是很多沒有被說完的話，還在岸邊拍打著，等一個可以被聽見的方式。</p>
</div>
