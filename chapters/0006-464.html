<p>女孩是在深秋那個無風的午後登島的。</p>
<p>她站在燈塔底下的時候，老人正把最後一疊紙箋送出窗台。海面平靜得不像話，連一片帆影也沒有；而那陣本該把信帶走的陸風，今天偏偏一步都不肯動。</p>
<p>女孩沒有先開口。她在底下看了很久那扇亮著的圓窗，彷彿在確認什麼，等老人終於走下來開門時，她才問：</p>
<p>「燈塔的主人，是不是從來不留信的副本？」</p>
<p>老人的手停在半空的銅門把上。他活了這麼多年，從來沒有人這樣直白地戳中他那件藏在心底的事。</p>
<p>「是。」他說。「寄出去的，都不留。」</p>
<p>女孩低下頭。「那我父親那封信呢？」她說。「一封四十年前就該到的信。他說他交給過風，可這四十年來，整個海灣都沒有人收到。」</p>
