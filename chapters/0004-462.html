 <p>─ 第四章 ─</p>
 <p>他把那些紙張一張、兩張、三張，攤平在窗台上。</p>
 <p id="l1">風從陸地深處吹過來。紙先輕輕顫了一下，像還拿不定主意；接著便一片接一片離開窗沿，飄上海面那道由月光鋪成的路。</p>
