  <div class="glow"></div>
  <div class="core"></div>
</div>
<div class="beam"></div>
<div class="content">
  <p>─ 第五章 ─</p>
  <p>後半夜，老人的燈塔是海面上唯一醒著的光。</p>
  <p>他沒有替任何一句話留底。他說思念一旦說出口，就該讓它走；留在手裡的心事太多，風便再也抬不動。</p>
</div>
